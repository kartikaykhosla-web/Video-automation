# Copy these names into Streamlit Community Cloud > App settings > Secrets.
# Never put real credentials in this repository.

ELEVENLABS_API_KEY = "replace-with-elevenlabs-key"

# Reuters and ANI values are only needed when those licensed APIs are enabled.
REUTERS_VIDEO_API_BASE_URL = "https://provider.example/api"
REUTERS_VIDEO_API_KEY = "replace-with-reuters-key"
REUTERS_VIDEO_SEARCH_PATH = "/videos"
REUTERS_VIDEO_AUTH_HEADER = "Authorization"
REUTERS_VIDEO_AUTH_SCHEME = "Bearer"

ANI_VIDEO_API_BASE_URL = "https://provider.example/api"
ANI_VIDEO_API_KEY = "replace-with-ani-key"
ANI_VIDEO_SEARCH_PATH = "/videos"
ANI_VIDEO_AUTH_HEADER = "Authorization"
ANI_VIDEO_AUTH_SCHEME = "Bearer"

[vertex_service_account]
type = "service_account"
project_id = "your-google-cloud-project-id"
private_key_id = "replace-with-private-key-id"
private_key = "replace-with-the-entire-private-key-including-BEGIN-and-END-lines"
client_email = "service-account@project-id.iam.gserviceaccount.com"
client_id = "replace-with-client-id"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "replace-with-service-account-certificate-url"
universe_domain = "googleapis.com"

