<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: #f7f7f8; }
    .editor-shell { border: 1px solid #3d4350; border-radius: 13px; background: #0f131b; padding: 10px; }
    button, input { font: inherit; }
    button {
      appearance: none; border: 1px solid #454b57; background: #242832; color: #fff;
      border-radius: 7px; padding: 7px 11px; font-weight: 650; cursor: pointer;
    }
    button:hover { border-color: #ff4b4b; background: #303541; }
    .preview-button { background: #e72b3d; border-color: #ff6473; }
    .preview-button:hover { background: #ff3b4d; }
    .save-button { background: #207a4d; border-color: #3ba970; }
    .save-button.dirty { background: #18a05f; border-color: #64d99a; box-shadow: 0 0 0 2px rgba(69,210,133,.16); }
    .save-button:disabled { opacity: .5; cursor: default; }
    .toolbar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
    .toolbar .label { color: #aab1bd; font-size: 12px; margin-right: 3px; }
    .preview-meta {
      margin-left: auto; color: #d6d9df; background: #1a1e27; border: 1px solid #3d4350;
      border-radius: 999px; padding: 5px 9px; font-size: 11px; white-space: nowrap;
    }
    .editor-workspace { display: grid; grid-template-columns: 190px minmax(0,1fr) 210px; gap: 10px; align-items: start; }
    .side-panel { min-height: 320px; padding: 10px; border: 1px solid #343b48; border-radius: 9px; background: #151a23; }
    .panel-title { margin-bottom: 9px; color: #b7beca; font-size: 11px; font-weight: 850; letter-spacing: .08em; }
    .layer-row { display: grid; grid-template-columns: 28px 1fr; gap: 7px; align-items: center; padding: 7px; margin-bottom: 5px; border: 1px solid transparent; border-radius: 7px; background: #202631; cursor: pointer; }
    .layer-row.selected { border-color: #ff4b4b; background: #30222a; }
    .layer-thumb { width: 28px; height: 24px; border-radius: 4px; object-fit: cover; background: #111; }
    .layer-name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; font-weight: 700; }
    .canvas-viewport { overflow: auto; padding: 10px; border-radius: 9px; background: #090c11; }
    .canvas-frame { width: 100%; min-width: 420px; margin: auto; transform-origin: top center; }
    #stage {
      position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
      border: 1px solid #3d4350; border-radius: 10px; background: #11151d center/cover no-repeat;
      touch-action: none; user-select: none;
    }
    #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); }
    .tile {
      position: absolute; overflow: hidden; border: 2px solid rgba(255,255,255,.7);
      border-radius: 6px; cursor: grab; background: #171a20; box-shadow: 0 5px 18px rgba(0,0,0,.32);
      touch-action: none;
    }
    .tile:active { cursor: grabbing; }
    .tile.selected { border-color: #ff4b4b; box-shadow: 0 0 0 2px rgba(255,75,75,.3); }
    .tile.text-only-slug { background: transparent; box-shadow: none; }
    .tile.text-only-slug .blur { display: none; }
    .blur { position: absolute; inset: -10%; width: 120%; height: 120%; object-fit: cover; filter: blur(18px) brightness(.68); }
    .sharp { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .tile-video { background: transparent; pointer-events: none; }
    .tile-play {
      position: absolute; left: 50%; top: 50%; z-index: 8; width: 42px; height: 42px;
      display: grid; place-items: center; transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,.78); border-radius: 50%; padding: 0;
      color: #fff; background: rgba(10,14,21,.78); box-shadow: 0 4px 16px rgba(0,0,0,.4);
      font-size: 16px; line-height: 1;
    }
    .tile-play:hover { background: #ff4b4b; border-color: #fff; }
    body.previewing .tile { border-color: transparent; border-radius: 0; box-shadow: none; cursor: default; }
    body.previewing .tile.selected { border-color: transparent; box-shadow: none; }
    body.previewing .tile-name, body.previewing .media-kind,
    body.previewing .resize, body.previewing .tile-play { display: none; }
    .tile-name {
      position: absolute; left: 6px; top: 6px; max-width: calc(100% - 36px); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; padding: 3px 6px; border-radius: 4px;
      background: rgba(0,0,0,.7); font-size: 11px; pointer-events: none;
    }
    .media-kind {
      position: absolute; right: 6px; top: 6px; z-index: 4; padding: 3px 6px;
      border-radius: 4px; background: rgba(0,0,0,.76); color: #fff;
      font-size: 10px; font-weight: 800; pointer-events: none;
    }
    .resize { position: absolute; z-index: 6; }
    .resize.n, .resize.s { left: 14px; right: 14px; height: 10px; cursor: ns-resize; }
    .resize.n { top: -5px; } .resize.s { bottom: -5px; }
    .resize.e, .resize.w { top: 14px; bottom: 14px; width: 10px; cursor: ew-resize; }
    .resize.e { right: -5px; } .resize.w { left: -5px; }
    .resize.ne, .resize.nw, .resize.se, .resize.sw {
      width: 15px; height: 15px; border: 2px solid #fff; border-radius: 3px;
      background: #ff4b4b; box-shadow: 0 1px 4px rgba(0,0,0,.45);
    }
    .resize.ne { right: -5px; top: -5px; cursor: nesw-resize; }
    .resize.nw { left: -5px; top: -5px; cursor: nwse-resize; }
    .resize.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
    .resize.sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #8d95a3; font-size: 14px; text-align: center; padding: 30px; }
    .hint { color: #8f96a3; font-size: 12px; margin: 7px 0 10px; }
    .inspector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .inspector-field label { display:block; color:#929aa8; font-size:10px; margin-bottom:3px; }
    .inspector-field input { width:100%; color:#fff; background:#242934; border:1px solid #444b58; border-radius:6px; padding:6px; }
    .inspector-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
    .inspector-actions button { padding:6px; font-size:11px; }
    .layer-order-title { margin-top:14px; color:#b7beca; font-size:10px; font-weight:850; letter-spacing:.08em; }
    .layer-order-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:7px; }
    .layer-order-actions button { padding:6px 4px; font-size:10px; }
    .guide { position:absolute; z-index:999; pointer-events:none; background:#37d5ff; display:none; }
    .guide.v { top:0; bottom:0; width:1px; } .guide.h { left:0; right:0; height:1px; }
    @media (max-width: 900px) { .editor-workspace { grid-template-columns: 150px minmax(0,1fr); } .inspector { grid-column:1 / -1; min-height:0; } }
    .strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 1px 8px; scrollbar-width: thin; }
    .chip {
      flex: 0 0 152px; display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 8px;
      padding: 6px; border: 1px solid #3d4350; border-radius: 8px; background: #1a1e27; cursor: pointer;
    }
    .chip.selected { border-color: #ff4b4b; background: #29212a; }
    .chip-thumb { position: relative; width: 42px; height: 34px; }
    .chip img { width: 42px; height: 34px; border-radius: 5px; object-fit: cover; }
    .chip-video {
      position: absolute; right: 2px; bottom: 2px; width: 15px; height: 15px;
      display: grid; place-items: center; border-radius: 50%; background: #ff4b4b;
      color: #fff; font-size: 8px; line-height: 1;
    }
    .chip-copy { min-width: 0; }
    .chip-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; font-weight: 700; }
    .chip-time { color: #9ba3af; font-size: 10px; margin-top: 2px; }
    .timing-card { border: 1px solid #3d4350; border-radius: 10px; background: #151922; padding: 12px; }
    .timing-top { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .selected-title { font-weight: 750; font-size: 14px; margin-bottom: 3px; }
    .selected-help { color: #9098a5; font-size: 11px; }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .delete { color: #ff9494; border-color: #6b3b42; }
    .fields { display: grid; grid-template-columns: repeat(3, minmax(100px, 1fr)); gap: 10px; margin-top: 11px; }
    .field label { display: block; color: #9ca4b0; font-size: 11px; margin-bottom: 4px; }
    .field input {
      width: 100%; color: #fff; background: #242934; border: 1px solid #444b58;
      border-radius: 7px; padding: 7px 9px; outline: none;
    }
    .field input:focus { border-color: #ff4b4b; }
    body.spatial-only .toolbar button[data-cols], body.spatial-only #fullFrame,
    body.spatial-only #sequence, body.spatial-only #together,
    body.spatial-only .fields,
    body.spatial-only .timeline { display: none; }
    body.no-delete #deleteImage { display: none; }
    body.freehand-only .toolbar button[data-cols], body.freehand-only #fullFrame,
    body.freehand-only #resetLayout, body.freehand-only #sequence,
    body.freehand-only #together { display: none; }
    body.spatial-only .timing-card { padding: 9px 12px; }
    body.spatial-only .selected-help::after { content: " Drag on the canvas and resize from the lower-right corner."; }
    .timeline { margin-top: 12px; }
    .track { position: relative; height: 38px; border-radius: 7px; background: #282d38; overflow: hidden; touch-action: none; }
    .track::before {
      content: ""; position: absolute; inset: 0; opacity: .35;
      background: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 1px), #737b89 calc(10% - 1px), #737b89 10%);
    }
    .time-bar { position: absolute; top: 5px; bottom: 5px; min-width: 12px; background: #ff4b4b; border-radius: 6px; cursor: grab; box-shadow: 0 2px 8px rgba(0,0,0,.28); touch-action: none; }
    .time-bar:active { cursor: grabbing; }
    .time-handle { position: absolute; top: 0; bottom: 0; width: 10px; background: rgba(255,255,255,.85); cursor: ew-resize; }
    .time-handle.left { left: 0; border-radius: 6px 2px 2px 6px; }
    .time-handle.right { right: 0; border-radius: 2px 6px 6px 2px; }
    .time-labels { display: flex; justify-content: space-between; color: #858d9a; font-size: 10px; margin-top: 4px; }
    @media (max-width: 640px) { .fields { grid-template-columns: 1fr 1fr; } .field.end { display: none; } }
  </style>
</head>
<body>
  <div class="editor-shell">
  <div class="toolbar">
    <span class="label">LAYOUT</span>
    <button type="button" id="previewComposition" class="preview-button">▶ Play video preview</button>
    <button type="button" id="saveLayout" class="save-button" disabled>✓ Layout saved</button>
    <button type="button" id="undo">↶ Undo</button>
    <button type="button" id="redo">↷ Redo</button>
    <button type="button" id="zoomOut">−</button>
    <button type="button" id="zoomLabel">100%</button>
    <button type="button" id="zoomIn">＋</button>
    <button type="button" id="fullFrame">Selected full frame</button>
    <button type="button" data-cols="2">2 columns</button>
    <button type="button" data-cols="3">3 columns</button>
    <button type="button" data-cols="4">4 columns</button>
    <button type="button" id="resetLayout">Reset layout</button>
    <span id="previewMeta" class="preview-meta"></span>
  </div>
  <div class="editor-workspace">
    <aside class="side-panel"><div class="panel-title">LAYERS</div><div id="layerList"></div></aside>
    <div class="canvas-viewport"><div id="canvasFrame" class="canvas-frame"><div id="stage"><span class="guide v" id="guideV"></span><span class="guide h" id="guideH"></span></div></div></div>
    <aside class="side-panel inspector"><div class="panel-title">POSITION & SIZE</div>
      <div class="inspector-grid">
        <div class="inspector-field"><label>X %</label><input id="inspectX" type="number" min="0" max="100" step="0.1"></div>
        <div class="inspector-field"><label>Y %</label><input id="inspectY" type="number" min="0" max="100" step="0.1"></div>
        <div class="inspector-field"><label>WIDTH %</label><input id="inspectW" type="number" min="8" max="100" step="0.1"></div>
        <div class="inspector-field"><label>HEIGHT %</label><input id="inspectH" type="number" min="8" max="100" step="0.1"></div>
      </div>
      <div class="inspector-actions"><button id="alignLeft">Left</button><button id="alignCenter">Center</button><button id="alignTop">Top</button><button id="alignMiddle">Middle</button><button id="fillWidth">Fill width</button><button id="fillHeight">Fill height</button></div>
      <div class="layer-order-title">LAYER ORDER</div>
      <div class="layer-order-actions">
        <button id="bringForward">Bring forward</button>
        <button id="bringFront">Bring to front</button>
        <button id="sendBackward">Send backward</button>
        <button id="sendBack">Send to back</button>
      </div>
      <p class="hint">Arrow keys move 1px-equivalent. Hold Shift for larger steps.</p>
    </aside>
  </div>
  <div class="hint">Edit mode keeps every slug visible and shows other media at the selected layer's start time. Play the video preview to inspect true timing.</div>
  <div id="imageStrip" class="strip"></div>
  <div id="timingCard" class="timing-card">
    <div class="timing-top">
      <div><div id="selectedTitle" class="selected-title"></div><div class="selected-help">Set timing only for the selected visual.</div></div>
      <div class="actions">
        <button type="button" id="sequence">Sequence across video</button>
        <button type="button" id="together">Show together</button>
        <button type="button" id="deleteImage" class="delete">Remove visual</button>
      </div>
    </div>
    <div class="fields">
      <div class="field"><label for="startInput">START (SECONDS)</label><input id="startInput" type="number" min="0" step="0.1"></div>
      <div class="field"><label for="durationInput">DURATION (SECONDS)</label><input id="durationInput" type="number" min="0.1" step="0.1"></div>
      <div class="field end"><label for="endInput">END</label><input id="endInput" type="text" disabled></div>
    </div>
    <div class="timeline">
      <div id="track" class="track"><div id="timeBar" class="time-bar"><span class="time-handle left"></span><span class="time-handle right"></span></div></div>
      <div class="time-labels"><span>0:00</span><span id="timelineEnd">0:00</span></div>
    </div>
  </div>
  </div>
  <audio id="voiceoverTrack" preload="auto"></audio>

  <script>
    const stage = document.getElementById("stage");
    const strip = document.getElementById("imageStrip");
    const timingCard = document.getElementById("timingCard");
    const selectedTitle = document.getElementById("selectedTitle");
    const startInput = document.getElementById("startInput");
    const durationInput = document.getElementById("durationInput");
    const endInput = document.getElementById("endInput");
    const track = document.getElementById("track");
    const timeBar = document.getElementById("timeBar");
    const timelineEnd = document.getElementById("timelineEnd");
    const previewMeta = document.getElementById("previewMeta");
    const layerList = document.getElementById("layerList");
    const canvasFrame = document.getElementById("canvasFrame");
    const voiceoverTrack = document.getElementById("voiceoverTrack");
    const inspectX = document.getElementById("inspectX"), inspectY = document.getElementById("inspectY");
    const inspectW = document.getElementById("inspectW"), inspectH = document.getElementById("inspectH");
    let args = { images: [], layout: [], background: "", video_duration: 60 };
    let layout = [];
    let selectedId = null;
    let spatialAction = null;
    let timingAction = null;
    let assetSignature = "";
    let history = [], future = [], zoom = 1;
    let previewing = false, previewTime = 0, previewStartedAt = 0, previewFrame = null;
    let voiceoverSource = "";
    let dirty = false;
    let pendingDeletedIds = [];
    let storageKey = "";

    const post = (type, payload = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...payload}, "*");
    const ready = () => post("streamlit:componentReady", {apiVersion: 1});
    const setHeight = () => post("streamlit:setFrameHeight", {height: Math.ceil(document.body.scrollHeight + 4)});
    const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
    const videoDuration = () => Math.max(.1, Number(args.video_duration) || 60);
    const previewButtonLabel = () => voiceoverSource
      ? "▶ Play preview with voiceover"
      : "▶ Play video preview";
    const current = () => layout.find(item => String(item.id) === String(selectedId));
    const imageFor = id => args.images.find(image => String(image.id) === String(id));
    const overlaps = (first, second) => {
      if (!first || !second) return false;
      const epsilon = .001;
      return first.start < second.start + second.duration - epsilon && second.start < first.start + first.duration - epsilon;
    };
    const visibleLayout = () => {
      if (previewing) return layout;
      const selected = current();
      if (!selected) return layout;
      const editTime = selected.start;
      return layout.filter(item => {
        if (imageFor(item.id)?.kind === "slug") return true;
        const activeAtEditTime = (
          editTime >= item.start - .001 &&
          editTime < item.start + item.duration - .001
        );
        return activeAtEditTime || String(item.id) === String(selected.id);
      });
    };
    const formatTime = value => {
      const total = Math.max(0, Number(value) || 0);
      const minutes = Math.floor(total / 60);
      const seconds = total - minutes * 60;
      return `${minutes}:${seconds.toFixed(1).padStart(4, "0")}`;
    };
    const setDirty = (value = true) => {
      dirty = value;
      const saveButton = document.getElementById("saveLayout");
      saveButton.disabled = !dirty;
      saveButton.classList.toggle("dirty", dirty);
      saveButton.textContent = dirty ? "Save layout changes" : "✓ Layout saved";
    };
    const serialisedLayout = (items = layout) => items.map(
      ({id,x,y,w,h,z,start,duration,locked}) =>
        ({id,x,y,w,h,z,start,duration,locked:Boolean(locked)})
    );
    const readDurableState = () => {
      if (!storageKey) return null;
      try { return JSON.parse(window.localStorage.getItem(storageKey) || "null"); }
      catch (_) { return null; }
    };
    const writeDurableState = (deletedIds = [], items = layout) => {
      if (!storageKey) return;
      try {
        window.localStorage.setItem(storageKey, JSON.stringify({
          items: serialisedLayout(items),
          deleted_ids: [...new Set(deletedIds.map(String))]
        }));
      } catch (_) {}
    };
    const commit = (deletedIds = [], deletionEvent = "") => {
      const allDeletedIds = [...new Set([...pendingDeletedIds, ...deletedIds].map(String))];
      const items = serialisedLayout();
      writeDurableState(allDeletedIds, items);
      setDirty(false);
      post("streamlit:setComponentValue", {
        value: {items, deleted_ids: allDeletedIds, deletion_event: deletionEvent},
        dataType: "json"
      });
    };
    const snapshot = () => JSON.stringify(layout.map(item => ({...item})));
    function remember() { history.push(snapshot()); if(history.length>60) history.shift(); future=[]; }
    function restore(serialized) {
      if(!serialized) return;
      layout=JSON.parse(serialized);
      pendingDeletedIds=(args.images||[])
        .filter(image=>!layout.some(item=>String(item.id)===String(image.id)))
        .map(image=>String(image.id));
      renderAll(); setDirty();
    }

    function defaultLayout(images, columns = Math.min(2, Math.max(1, images.length))) {
      if (!images.length) return [];
      const cols = Math.max(1, Math.min(columns, 4));
      const rows = Math.ceil(images.length / cols);
      const gap = .018;
      const w = (1 - gap * (cols + 1)) / cols;
      const h = (1 - gap * (rows + 1)) / rows;
      return images.map((image, index) => ({
        id: String(image.id), x: gap + (index % cols) * (w + gap), y: gap + Math.floor(index / cols) * (h + gap),
        w, h, z: index + 1, start: Number(image.start) || 0, duration: Math.max(.1, Number(image.duration) || 5)
      }));
    }

    function positionItems(items, columns = Math.min(2, Math.max(1, items.length))) {
      if (!items.length) return;
      const cols = Math.max(1, Math.min(Number(columns) || 1, 4, items.length));
      const rows = Math.ceil(items.length / cols);
      const gap = .018;
      const width = (1 - gap * (cols + 1)) / cols;
      const height = (1 - gap * (rows + 1)) / rows;
      items.forEach((item, index) => Object.assign(item, {
        x: gap + (index % cols) * (width + gap),
        y: gap + Math.floor(index / cols) * (height + gap),
        w: width,
        h: height,
        z: index + 1
      }));
    }

    function normaliseIncoming(images, incoming) {
      const byId = new Map((incoming || []).map(item => [String(item.id), item]));
      const defaults = defaultLayout(images);
      return images.map((image, index) => {
        const found = byId.get(String(image.id)) || defaults[index];
        const duration = clamp(Number(found.duration ?? image.duration) || 5, .1, videoDuration());
        const start = clamp(Number(found.start ?? image.start) || 0, 0, Math.max(0, videoDuration() - duration));
        return {
          id: String(image.id), x: clamp(Number(found.x) || 0, 0, .96), y: clamp(Number(found.y) || 0, 0, .96),
          w: clamp(Number(found.w) || .45, .08, 1), h: clamp(Number(found.h) || .45, .08, 1),
          z: Number(found.z) || index + 1, start, duration, locked:false
        };
      });
    }

    function selectImage(id) {
      if (previewing) stopCompositionPreview();
      selectedId = String(id);
      renderStage();
      renderLayers();
      renderInspector();
      renderStrip();
      renderTiming();
    }

    function renderLayers() {
      layerList.innerHTML = "";
      [...layout].sort((a,b)=>b.z-a.z).forEach(item => {
        const image=imageFor(item.id); if(!image) return;
        const row=document.createElement("div"); row.className=`layer-row${String(item.id)===String(selectedId)?" selected":""}`;
        row.innerHTML=`<img class="layer-thumb" src="${image.src||""}"><span class="layer-name"></span>`;
        row.querySelector(".layer-name").textContent=image.name||"Object";
        row.addEventListener("click",()=>selectImage(item.id));
        layerList.appendChild(row);
      });
    }

    function renderInspector() {
      const item=current(); [inspectX,inspectY,inspectW,inspectH].forEach(input=>input.disabled=!item);
      ["bringForward","bringFront","sendBackward","sendBack"].forEach(id=>document.getElementById(id).disabled=!item);
      if(!item) return;
      inspectX.value=(item.x*100).toFixed(1); inspectY.value=(item.y*100).toFixed(1);
      inspectW.value=(item.w*100).toFixed(1); inspectH.value=(item.h*100).toFixed(1);
    }

    function renderStage() {
      stage.innerHTML = '<span class="guide v" id="guideV"></span><span class="guide h" id="guideH"></span>';
      stage.style.backgroundImage = args.background ? `linear-gradient(rgba(8,10,15,.28),rgba(8,10,15,.28)),url('${args.background}')` : "";
      if (!args.images.length) {
        const empty = document.createElement("div"); empty.className = "empty";
        empty.textContent = "Add images or video bytes above to start arranging them."; stage.appendChild(empty);
        previewMeta.textContent = "No visuals"; return;
      }
      const visible = visibleLayout();
      [...visible].sort((a,b) => a.z - b.z).forEach(item => {
        const image = imageFor(item.id); if (!image) return;
        const tile = document.createElement("div");
        tile.className = `tile${String(item.id) === String(selectedId) ? " selected" : ""}${image.text_only ? " text-only-slug" : ""}`;
        tile.dataset.id = String(item.id);
        Object.assign(tile.style, {left:`${item.x*100}%`, top:`${item.y*100}%`, width:`${item.w*100}%`, height:`${item.h*100}%`, zIndex:item.z});
        const playableVideo = image.kind === "video" && Boolean(image.video_src);
        const sharpMedia = playableVideo
          ? `<video class="sharp tile-video" muted playsinline preload="metadata" poster="${image.src || ""}"></video><button type="button" class="tile-play" title="Play video preview" aria-label="Play video preview">▶</button>`
          : `<img class="sharp" draggable="false" src="${image.src}">`;
        tile.innerHTML = `<img class="blur" draggable="false" src="${image.src}">${sharpMedia}<span class="tile-name"></span><span class="media-kind"></span><span class="resize n" data-resize="n"></span><span class="resize ne" data-resize="ne"></span><span class="resize e" data-resize="e"></span><span class="resize se" data-resize="se"></span><span class="resize s" data-resize="s"></span><span class="resize sw" data-resize="sw"></span><span class="resize w" data-resize="w"></span><span class="resize nw" data-resize="nw"></span>`;
        if (playableVideo) {
          const video = tile.querySelector(".tile-video");
          const playButton = tile.querySelector(".tile-play");
          video.src = image.video_src;
          video.loop = String(image.id) !== "source";
          const previewVolume = clamp(Number(image.preview_volume) || 0, 0, 1);
          video.volume = previewVolume;
          video.muted = previewVolume <= 0;
          playButton.addEventListener("pointerdown", event => event.stopPropagation());
          playButton.addEventListener("click", async event => {
            event.preventDefault(); event.stopPropagation();
            if (video.paused) {
              stage.querySelectorAll("video.tile-video").forEach(other => {
                if (other !== video) other.pause();
              });
              try { await video.play(); } catch (_) { return; }
            } else {
              video.pause();
            }
          });
          video.addEventListener("play", () => { playButton.textContent = "❚❚"; });
          video.addEventListener("pause", () => { playButton.textContent = "▶"; });
          video.addEventListener("ended", () => { playButton.textContent = "▶"; });
        }
        tile.querySelector(".tile-name").textContent = image.name || `Image ${item.id}`;
        const kind = image.kind === "video" ? "VIDEO" : image.kind === "slug" ? "SLUG" : "IMAGE";
        tile.querySelector(".media-kind").textContent = kind;
        tile.addEventListener("pointerdown", event => beginSpatial(event, item, event.target.dataset.resize || "move"));
        stage.appendChild(tile);
      });
      const selected = current();
      previewMeta.textContent = selected
        ? `${formatTime(selected.start)}–${formatTime(selected.start + selected.duration)} · ${visible.length} visual${visible.length === 1 ? "" : "s"}`
        : "No timing group selected";
    }

    function renderStrip() {
      strip.innerHTML = "";
      args.images.forEach(image => {
        const item = layout.find(value => String(value.id) === String(image.id));
        if (!item) return;
        const chip = document.createElement("div");
        chip.className = `chip${String(image.id) === String(selectedId) ? " selected" : ""}`;
        chip.innerHTML = `<div class="chip-thumb"><img src="${image.src}"><span class="chip-video"></span></div><div class="chip-copy"><div class="chip-name"></div><div class="chip-time"></div></div>`;
        const videoBadge = chip.querySelector(".chip-video");
        if (image.kind === "video") videoBadge.textContent = "▶";
        else videoBadge.remove();
        chip.querySelector(".chip-name").textContent = image.name || "Visual";
        chip.querySelector(".chip-time").textContent = item ? `${formatTime(item.start)} · ${item.duration.toFixed(1)}s` : "";
        chip.addEventListener("click", () => selectImage(image.id));
        strip.appendChild(chip);
      });
    }

    function renderTiming() {
      const item = current();
      timingCard.style.display = item ? "block" : "none";
      if (!item) return;
      const image = imageFor(item.id);
      const deleteButton = document.getElementById("deleteImage");
      deleteButton.style.display = (
        args.allow_delete === false || image?.deletable === false
      ) ? "none" : "";
      selectedTitle.textContent = image?.name || "Selected visual";
      startInput.value = item.start.toFixed(1);
      durationInput.value = item.duration.toFixed(1);
      endInput.value = formatTime(item.start + item.duration);
      timelineEnd.textContent = formatTime(videoDuration());
      timeBar.style.left = `${item.start / videoDuration() * 100}%`;
      timeBar.style.width = `${item.duration / videoDuration() * 100}%`;
    }

    function renderAll() { renderStage(); renderLayers(); renderInspector(); renderStrip(); renderTiming(); setHeight(); }

    function updateCompositionFrame(timestamp) {
      if (!previewing) return;
      previewTime = clamp((timestamp - previewStartedAt) / 1000, 0, videoDuration());
      stage.querySelectorAll(".tile").forEach(tile => {
        const item = layout.find(value => String(value.id) === String(tile.dataset.id));
        if (!item) return;
        const visible = previewTime >= item.start && previewTime < item.start + item.duration;
        tile.style.display = visible ? "block" : "none";
        const video = tile.querySelector("video.tile-video");
        if (!video) return;
        if (!visible) { video.pause(); return; }
        const elapsed = Math.max(0, previewTime - item.start);
        const expected = (
          video.loop && Number.isFinite(video.duration) && video.duration > 0
        ) ? elapsed % video.duration : elapsed;
        if (video.readyState >= 1 && Math.abs((video.currentTime || 0) - expected) > .35) {
          try { video.currentTime = Math.min(expected, Math.max(0, (video.duration || expected) - .03)); } catch (_) {}
        }
        if (video.paused) video.play().catch(() => {});
      });
      if (voiceoverSource) {
        const voiceStart = Math.max(0, Number(args.voiceover_start) || 0);
        let voiceTime = previewTime - voiceStart;
        let voicePaused = voiceTime < 0;
        const pauses = [...(args.voiceover_pauses || [])].sort(
          (a, b) => Number(a.start || 0) - Number(b.start || 0)
        );
        pauses.forEach(pause => {
          const pauseStart = Math.max(0, Number(pause.start) || 0);
          const pauseDuration = Math.max(0, Number(pause.duration) || 0);
          if (previewTime >= pauseStart && previewTime < pauseStart + pauseDuration) {
            voicePaused = true;
          } else if (previewTime >= pauseStart + pauseDuration) {
            voiceTime -= pauseDuration;
          }
        });
        if (voicePaused || voiceTime < 0) {
          voiceoverTrack.pause();
        } else {
          const expectedVoiceTime = Math.max(0, voiceTime);
          if (
            voiceoverTrack.readyState >= 1 &&
            Math.abs((voiceoverTrack.currentTime || 0) - expectedVoiceTime) > .35
          ) {
            try {
              voiceoverTrack.currentTime = Math.min(
                expectedVoiceTime,
                Math.max(0, (voiceoverTrack.duration || expectedVoiceTime) - .03)
              );
            } catch (_) {}
          }
          if (voiceoverTrack.paused) voiceoverTrack.play().catch(() => {});
        }
      }
      previewMeta.textContent = `Preview ${formatTime(previewTime)} / ${formatTime(videoDuration())}`;
      if (previewTime >= videoDuration() - .01) {
        stopCompositionPreview();
        return;
      }
      previewFrame = requestAnimationFrame(updateCompositionFrame);
    }

    function startCompositionPreview() {
      if (previewing) { stopCompositionPreview(); return; }
      previewing = true;
      previewTime = 0;
      previewStartedAt = performance.now();
      document.body.classList.add("previewing");
      document.getElementById("previewComposition").textContent = "■ Stop preview";
      renderStage();
      previewFrame = requestAnimationFrame(updateCompositionFrame);
    }

    function stopCompositionPreview() {
      previewing = false;
      if (previewFrame) cancelAnimationFrame(previewFrame);
      previewFrame = null;
      stage.querySelectorAll("video.tile-video").forEach(video => video.pause());
      voiceoverTrack.pause();
      try { voiceoverTrack.currentTime = 0; } catch (_) {}
      document.body.classList.remove("previewing");
      document.getElementById("previewComposition").textContent = previewButtonLabel();
      previewTime = 0;
      renderStage();
    }

    function beginSpatial(event, item, mode) {
      if (previewing) {
        stopCompositionPreview();
        selectedId = String(item.id);
        renderAll();
        return;
      }
      event.preventDefault(); selectedId = String(item.id); remember();
      const rect = stage.getBoundingClientRect();
      spatialAction = {item, mode, pointerId:event.pointerId, tile:event.currentTarget, startX:event.clientX, startY:event.clientY,
        x:item.x, y:item.y, w:item.w, h:item.h, stageW:rect.width, stageH:rect.height};
      event.currentTarget.setPointerCapture(event.pointerId);
      renderStrip(); renderTiming();
    }

    window.addEventListener("pointermove", event => {
      if (spatialAction && event.pointerId === spatialAction.pointerId) {
        const a = spatialAction, dx = (event.clientX-a.startX)/a.stageW, dy = (event.clientY-a.startY)/a.stageH;
        if (a.mode === "move") {
          a.item.x = clamp(a.x+dx,0,1-a.item.w); a.item.y = clamp(a.y+dy,0,1-a.item.h);
        } else {
          const minSize = .08;
          if (a.mode.includes("e")) a.item.w = clamp(a.w+dx,minSize,1-a.x);
          if (a.mode.includes("s")) a.item.h = clamp(a.h+dy,minSize,1-a.y);
          if (a.mode.includes("w")) {
            const right = a.x+a.w; a.item.x = clamp(a.x+dx,0,right-minSize); a.item.w = right-a.item.x;
          }
          if (a.mode.includes("n")) {
            const bottom = a.y+a.h; a.item.y = clamp(a.y+dy,0,bottom-minSize); a.item.h = bottom-a.item.y;
          }
        }
        const snap=.008;
        if(Math.abs(a.item.x)<snap)a.item.x=0; if(Math.abs(a.item.y)<snap)a.item.y=0;
        if(Math.abs((a.item.x+a.item.w)-1)<snap)a.item.w=1-a.item.x;
        if(Math.abs((a.item.y+a.item.h)-1)<snap)a.item.h=1-a.item.y;
        if(Math.abs((a.item.x+a.item.w/2)-.5)<snap)a.item.x=.5-a.item.w/2;
        if(Math.abs((a.item.y+a.item.h/2)-.5)<snap)a.item.y=.5-a.item.h/2;
        Object.assign(a.tile.style,{left:`${a.item.x*100}%`,top:`${a.item.y*100}%`,width:`${a.item.w*100}%`,height:`${a.item.h*100}%`,zIndex:a.item.z});
      }
      if (timingAction && event.pointerId === timingAction.pointerId) {
        const a = timingAction, delta = (event.clientX-a.startX)/a.trackW*videoDuration();
        if (a.mode === "move") a.item.start = clamp(a.start+delta,0,videoDuration()-a.item.duration);
        if (a.mode === "left") { const newStart=clamp(a.start+delta,0,a.start+a.duration-.1); a.item.duration=a.duration+(a.start-newStart); a.item.start=newStart; }
        if (a.mode === "right") a.item.duration=clamp(a.duration+delta,.1,videoDuration()-a.item.start);
        renderStage(); renderTiming();
      }
    });

    window.addEventListener("pointerup", event => {
      if (spatialAction && event.pointerId === spatialAction.pointerId) { spatialAction=null; renderAll(); setDirty(); }
      if (timingAction && event.pointerId === timingAction.pointerId) { timingAction=null; renderStrip(); renderTiming(); setDirty(); }
    });

    timeBar.addEventListener("pointerdown", event => {
      const item=current(); if(!item) return; event.preventDefault();
      const mode=event.target.classList.contains("left")?"left":event.target.classList.contains("right")?"right":"move";
      timingAction={item,mode,pointerId:event.pointerId,startX:event.clientX,start:item.start,duration:item.duration,trackW:track.getBoundingClientRect().width};
      event.currentTarget.setPointerCapture(event.pointerId);
    });

    function updateFromInputs() {
      const item=current(); if(!item) return;
      const duration=clamp(Number(durationInput.value)||.1,.1,videoDuration());
      item.duration=duration; item.start=clamp(Number(startInput.value)||0,0,videoDuration()-duration);
      renderStage(); renderStrip(); renderTiming(); setDirty();
    }
    startInput.addEventListener("change", updateFromInputs);
    durationInput.addEventListener("change", updateFromInputs);

    function updateGeometryFromInspector(){const item=current();if(!item)return;remember();item.x=clamp(Number(inspectX.value)/100,0,1-item.w);item.y=clamp(Number(inspectY.value)/100,0,1-item.h);item.w=clamp(Number(inspectW.value)/100,.08,1-item.x);item.h=clamp(Number(inspectH.value)/100,.08,1-item.y);renderAll();setDirty();}
    [inspectX,inspectY,inspectW,inspectH].forEach(input=>input.addEventListener("change",updateGeometryFromInspector));
    function applyAlign(change){const item=current();if(!item)return;remember();change(item);renderAll();setDirty();}
    document.getElementById("alignLeft").onclick=()=>applyAlign(i=>i.x=0);
    document.getElementById("alignCenter").onclick=()=>applyAlign(i=>i.x=(1-i.w)/2);
    document.getElementById("alignTop").onclick=()=>applyAlign(i=>i.y=0);
    document.getElementById("alignMiddle").onclick=()=>applyAlign(i=>i.y=(1-i.h)/2);
    document.getElementById("fillWidth").onclick=()=>applyAlign(i=>{i.x=0;i.w=1});
    document.getElementById("fillHeight").onclick=()=>applyAlign(i=>{i.y=0;i.h=1});
    function reorderLayer(mode) {
      const item=current(); if(!item)return;
      remember();
      const ordered=[...layout].sort((a,b)=>a.z-b.z);
      const index=ordered.findIndex(value=>String(value.id)===String(item.id));
      if(index<0)return;
      let target=index;
      if(mode==="forward") target=Math.min(ordered.length-1,index+1);
      if(mode==="front") target=ordered.length-1;
      if(mode==="backward") target=Math.max(0,index-1);
      if(mode==="back") target=0;
      ordered.splice(index,1); ordered.splice(target,0,item);
      ordered.forEach((value,zIndex)=>value.z=zIndex+1);
      renderAll(); setDirty();
    }
    document.getElementById("bringForward").onclick=()=>reorderLayer("forward");
    document.getElementById("bringFront").onclick=()=>reorderLayer("front");
    document.getElementById("sendBackward").onclick=()=>reorderLayer("backward");
    document.getElementById("sendBack").onclick=()=>reorderLayer("back");
    document.getElementById("undo").onclick=()=>{if(!history.length)return;future.push(snapshot());restore(history.pop());};
    document.getElementById("redo").onclick=()=>{if(!future.length)return;history.push(snapshot());restore(future.pop());};
    document.getElementById("previewComposition").onclick=startCompositionPreview;
    document.getElementById("saveLayout").onclick=()=>{if(dirty)commit();};
    function setZoom(value){zoom=clamp(value,.5,1.75);canvasFrame.style.width=`${zoom*100}%`;document.getElementById("zoomLabel").textContent=`${Math.round(zoom*100)}%`;setHeight();}
    document.getElementById("zoomOut").onclick=()=>setZoom(zoom-.1); document.getElementById("zoomIn").onclick=()=>setZoom(zoom+.1); document.getElementById("zoomLabel").onclick=()=>setZoom(1);
    window.addEventListener("keydown",event=>{const item=current();if(!item||!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(event.key))return;event.preventDefault();remember();const step=(event.shiftKey?10:1)/1920;if(event.key==="ArrowLeft")item.x=clamp(item.x-step,0,1-item.w);if(event.key==="ArrowRight")item.x=clamp(item.x+step,0,1-item.w);if(event.key==="ArrowUp")item.y=clamp(item.y-step,0,1-item.h);if(event.key==="ArrowDown")item.y=clamp(item.y+step,0,1-item.h);renderAll();setDirty();});

    document.querySelectorAll("[data-cols]").forEach(button => button.addEventListener("click", () => {
      positionItems(visibleLayout(), Number(button.dataset.cols)); renderAll(); setDirty();
    }));
    document.getElementById("fullFrame").addEventListener("click", () => {
      const item=current(); if(!item) return;
      Object.assign(item,{x:0,y:0,w:1,h:1,z:Math.max(...layout.map(value=>value.z),0)+1});
      renderAll(); setDirty();
    });
    document.getElementById("resetLayout").addEventListener("click", () => {
      const visible=visibleLayout(); positionItems(visible, Math.min(2, Math.max(1, visible.length))); renderAll(); setDirty();
    });
    document.getElementById("sequence").addEventListener("click", () => {
      if(!layout.length) return; const slot=videoDuration()/layout.length;
      layout.forEach((item,index)=>{item.start=index*slot;item.duration=slot;}); renderAll(); setDirty();
    });
    document.getElementById("together").addEventListener("click", () => {
      const selected=current(); const start=selected?.start||0; const duration=selected?.duration||Math.min(5,videoDuration());
      layout.forEach(item=>{item.start=start;item.duration=Math.min(duration,videoDuration()-start);}); renderAll(); setDirty();
    });
    document.getElementById("deleteImage").addEventListener("click", () => {
      const selectedImage=imageFor(selectedId);
      if(selectedId==null || args.allow_delete === false || selectedImage?.deletable === false) return;
      const deleted=String(selectedId);
      remember();
      if(!pendingDeletedIds.includes(deleted)) pendingDeletedIds.push(deleted);
      layout=layout.filter(item=>String(item.id)!==deleted);
      selectedId=layout[0]?.id??null;
      renderAll();
      // Deletion must reach Python immediately so its native uploader and
      // backing session data are cleared in the same user action. A unique
      // event id lets Python ignore the component's stale return value on the
      // following rerun without blocking a later re-add/delete cycle.
      commit([deleted], `${Date.now()}:${deleted}:${Math.random()}`);
    });

    window.addEventListener("message", event => {
      if(event.data?.type!=="streamlit:render") return;
      const rawNextArgs=event.data.args||args;
      const rawNextImages=rawNextArgs.images||[];
      storageKey=String(rawNextArgs.storage_key||"");
      const durableState=readDurableState();
      const rawImageIds=new Set(rawNextImages.map(image=>String(image.id)));
      const durableDeletedIds=Array.isArray(durableState?.deleted_ids)
        ? durableState.deleted_ids.map(String)
        : [];
      // A missing id means Python has acknowledged the deletion. Stop
      // suppressing it so the same asset can be added again immediately.
      pendingDeletedIds=[...new Set([...pendingDeletedIds, ...durableDeletedIds])]
        .filter(id=>rawImageIds.has(id));
      if(durableState && durableDeletedIds.length!==pendingDeletedIds.length) {
        writeDurableState(pendingDeletedIds, durableState.items||[]);
      }
      const nextArgs={
        ...rawNextArgs,
        images:rawNextImages.filter(
          image=>!pendingDeletedIds.includes(String(image.id))
        )
      };
      // Image previews change as text or colours are edited. Identity—not preview
      // byte size—must control layout resets so freehand geometry is preserved.
      const nextSignature=(nextArgs.images||[]).map(image=>`${image.id}:${image.kind||"image"}`).join("|");
      args=nextArgs;
      const nextVoiceoverSource = String(args.voiceover_src || "");
      if (nextVoiceoverSource !== voiceoverSource) {
        voiceoverSource = nextVoiceoverSource;
        voiceoverTrack.pause();
        voiceoverTrack.src = voiceoverSource;
        if (voiceoverSource) voiceoverTrack.load();
      }
      if (!previewing) {
        document.getElementById("previewComposition").textContent = previewButtonLabel();
      }
      voiceoverTrack.volume = clamp(Number(args.voiceover_volume) || 1, 0, 1);
      if (previewing) stopCompositionPreview();
      document.body.classList.toggle("spatial-only", Boolean(args.spatial_only));
      document.body.classList.toggle("freehand-only", Boolean(args.freehand_only));
      document.body.classList.toggle("no-delete", args.allow_delete === false);
      if(nextSignature!==assetSignature) {
        const durableItems=Array.isArray(durableState?.items)
          ? durableState.items
          : null;
        layout=normaliseIncoming(args.images||[],durableItems||args.layout||[]);
        assetSignature=nextSignature;
        if(!pendingDeletedIds.length) setDirty(false);
      } else {
        const existingById=new Map(layout.map(item=>[String(item.id),item]));
        const incoming=normaliseIncoming(args.images||[],args.layout||[]);
        layout=(args.images||[]).map(image=>existingById.get(String(image.id))||incoming.find(item=>String(item.id)===String(image.id)));
      }
      if(!args.images.some(image=>String(image.id)===String(selectedId))) selectedId=args.images[0]?.id??null;
      renderAll();
    });
    ready(); setHeight();
  </script>
</body>
</html>
